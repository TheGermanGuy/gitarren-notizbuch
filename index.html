<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17262E">
<title>Gitarren-Notizbuch</title>
<style>
:root{--bg:#E8EDEE;--ink:#17262E;--teal:#1D6F6A;--brass:#B5832B;--red:#A8402B;--card:#F8FAFA;--line:#C5D0D3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
header{background:var(--ink);color:#fff;padding:18px 16px 14px;border-bottom:4px solid var(--brass)}
h1{margin:0;font:600 24px/1.2 Georgia,"Iowan Old Style",serif}
header p{margin:4px 0 0;color:#B9C8CD;font-size:14px}
main{max-width:680px;margin:0 auto;padding:16px}
#rec{text-align:center;padding:12px 0 6px}
#recBtn{width:132px;height:132px;border-radius:50%;border:8px double var(--brass);background:var(--ink);color:#fff;font:600 15px Georgia,serif;cursor:pointer}
#recBtn.on{background:var(--red);border-color:#fff}
#timer{display:block;margin-top:8px;font-variant-numeric:tabular-nums;min-height:24px}
.opts{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:8px 0 16px}
details{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:16px}
summary{cursor:pointer;font-weight:600}
details label{display:block;margin-top:10px;font-size:14px}
input[type=text],input[type=password]{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff}
.clip{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:14px}
.clip input.name{font:600 18px Georgia,serif;border:0;border-bottom:1px dashed var(--line);background:transparent;padding:2px 0}
.meta{font-size:13px;color:#51666E;margin:2px 0 8px}
audio{width:100%;margin-bottom:8px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button.b{padding:9px 12px;border-radius:6px;border:1px solid var(--teal);background:#fff;color:var(--teal);font:inherit;font-size:14px;cursor:pointer}
button.b.p{background:var(--teal);color:#fff}
button.b.d{border-color:var(--red);color:var(--red)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
pre{background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px;overflow-x:auto;font:13px/1.35 ui-monospace,Menlo,monospace;margin:10px 0 0}
.ai{white-space:pre-wrap;margin-top:10px;padding:10px;border-left:4px solid var(--brass);background:#fff;font-size:15px}
#msg{min-height:22px;text-align:center;color:var(--red);font-size:14px;margin-bottom:8px}
.empty{text-align:center;color:#51666E;padding:24px}

h3{margin:14px 0 6px;font:600 16px Georgia,serif}
.hint{margin:0 0 6px;font-size:13px;color:#51666E}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tags span{background:var(--ink);color:#fff;border-radius:14px;padding:3px 11px;font-size:13px}
.chords{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chords svg{flex:none;background:#fff;border:1px solid var(--line);border-radius:6px}
.tabs svg{display:block;width:100%;max-width:360px;background:#fff;border:1px solid var(--line);border-radius:6px;margin-bottom:8px}
.gl{stroke:#8FA1A7;stroke-width:1}.nut{stroke:var(--ink);stroke-width:4}
.mk{font:11px system-ui,sans-serif;fill:#51666E}.cn{font:700 13px Georgia,serif;fill:var(--ink)}
.op{fill:none;stroke:var(--ink);stroke-width:1.2}
.dot,.tb{fill:var(--teal)}.tn,.fn{font:700 10px system-ui,sans-serif;fill:#fff}
.du{fill:var(--brass)}
ol,ul{margin:0;padding-left:22px}li{margin-bottom:4px}
.nt{cursor:pointer;outline:none}
.nt:hover .tb,.nt.on .tb,.nt:focus-visible .tb{fill:var(--brass)}
.nt:focus-visible rect:first-child{stroke:var(--brass);stroke-width:2}
</style></head><body>
<header><h1>Gitarren-Notizbuch</h1><p>Aufnehmen, speichern, analysieren, nachspielen.</p></header>
<main>
<section id="rec">
  <button id="recBtn" type="button">Aufnahme starten</button>
  <span id="timer"></span>
</section>
<div id="msg" role="status"></div>
<div class="opts">
  <label><input type="checkbox" id="tabOpt"> Tabs erzeugen</label>
  <label>Antippen spielt: <select id="playMode"><option value="syn">Referenzton</option><option value="orig">Original-Ausschnitt</option></select></label>
</div>
<details>
  <summary>Gemini-Zugang</summary>
  <label>API-Key (bleibt nur in diesem Browser)<input type="password" id="gkey" autocomplete="off"></label>
  <label>Modell<input type="text" id="gmodel" placeholder="gemini-2.5-flash"></label>
</details>
<section id="list"></section>
</main>
<script>
const $=s=>document.querySelector(s), SR=22050;
const NAMES=["C","C♯","D","D♯","E","F","F♯","G","G♯","A","B","H"];
const nn=m=>NAMES[m%12]+(Math.floor(m/12)-1);
const msg=t=>$('#msg').textContent=t||'';
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

/* Speicher (IndexedDB) */
const dbp=new Promise((res,rej)=>{const r=indexedDB.open('gitarre',1);r.onupgradeneeded=()=>r.result.createObjectStore('clips',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(m,f)=>{const d=await dbp;return new Promise((res,rej)=>{const t=d.transaction('clips',m);const o=f(t.objectStore('clips'));t.oncomplete=()=>res(o&&o.result);t.onerror=()=>rej(t.error)})};
const getAll=()=>tx('readonly',s=>s.getAll()), put=c=>tx('readwrite',s=>s.put(c)), del=id=>tx('readwrite',s=>s.delete(id));

/* Aufnahme */
let mr,chunks,t0,tick;
const setBtn=on=>{$('#recBtn').classList.toggle('on',on);$('#recBtn').textContent=on?'Stopp':'Aufnahme starten';if(!on)$('#timer').textContent=''};
$('#recBtn').onclick=async()=>{
  if(mr&&mr.state==='recording'){mr.stop();return}
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    mr=new MediaRecorder(st);chunks=[];msg('');
    mr.ondataavailable=e=>chunks.push(e.data);
    mr.onstop=async()=>{clearInterval(tick);st.getTracks().forEach(t=>t.stop());setBtn(false);await finish(new Blob(chunks,{type:mr.mimeType}))};
    mr.start();t0=Date.now();setBtn(true);
    tick=setInterval(()=>{const s=(Date.now()-t0)/1000;$('#timer').textContent=s.toFixed(0)+' s (max. 60 s)';if(s>=60)mr.stop()},250);
  }catch(e){msg('Kein Mikrofonzugang: '+e.message+' (Seite muss über https oder localhost laufen.)')}
};
async function finish(blob){
  const c={id:Date.now(),name:'Stück vom '+new Date().toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'}),blob,notes:null,ai:null};
  await put(c);await render();await analyze(c.id);await askGemini(c.id);
}

/* Audio dekodieren */
async function decode(blob){const ctx=new(window.AudioContext||window.webkitAudioContext)({sampleRate:SR});const b=await ctx.decodeAudioData(await blob.arrayBuffer());ctx.close();return b.getChannelData(0)}

/* Tonhöhenerkennung (YIN, einstimmig) */
function yin(x,o,W){
  const tmax=Math.floor(SR/70),tmin=Math.floor(SR/1000),d=new Float32Array(tmax+2),n=new Float32Array(tmax+2);
  for(let t=1;t<=tmax;t++){let s=0;for(let i=0;i<W;i++){const v=x[o+i]-x[o+i+t];s+=v*v}d[t]=s}
  let run=0;n[0]=1;
  for(let t=1;t<=tmax;t++){run+=d[t];n[t]=run?d[t]*t/run:1}
  for(let t=tmin;t<tmax;t++){
    if(n[t]<0.15){
      while(t+1<tmax&&n[t+1]<n[t])t++;
      const a=n[t-1],b=n[t],c=n[t+1],den=a-2*b+c,tt=den?t+(a-c)/(2*den):t;
      return SR/tt;
    }
  }
  return null;
}
function detect(x){
  const W=1024,H=512,fr=[];
  for(let o=0;o+W+320<x.length;o+=H){
    let r=0;for(let i=0;i<W;i++)r+=x[o+i]*x[o+i];r=Math.sqrt(r/W);
    let m=null;if(r>0.01){const f=yin(x,o,W);if(f)m=Math.round(69+12*Math.log2(f/440))}
    fr.push(m);
  }
  const out=[];let cur=null,gap=0;
  fr.forEach((m,i)=>{
    if(m!==null&&cur&&m===cur.m){cur.e=i;gap=0;return}
    if(cur&&m===null&&gap<2){gap++;return}
    if(cur){out.push(cur);cur=null}
    gap=0;if(m!==null)cur={m,s:i,e:i};
  });
  if(cur)out.push(cur);
  return out.filter(n=>n.e-n.s>=2&&n.m>=40&&n.m<=88).map(n=>({m:n.m,t:+(n.s*H/SR).toFixed(2),d:+((n.e-n.s+1)*H/SR).toFixed(2)}));
}

/* Tabs (Standardstimmung, Töne -> Saite/Bund) */
const OPEN=[64,59,55,50,45,40],LAB=['e','B','G','D','A','E'];
function tabCols(ns){
  let prev=null;
  return ns.map(n=>{
    let best=null;
    OPEN.forEach((o,s)=>{const f=n.m-o;if(f>=0&&f<=15){const sc=prev===null?f:Math.abs(f-prev)+f*0.3;if(!best||sc<best.sc)best={s,f,sc}}});
    if(best)prev=best.f;return best;
  });
}
function makeTab(ns){
  const cols=tabCols(ns);
  let out='';
  for(let i=0;i<cols.length;i+=10){
    const part=cols.slice(i,i+10);
    out+=LAB.map((l,s)=>l+'|'+part.map(c=>c&&c.s===s?('-'+c.f).padEnd(3,'-'):'---').join('')+'|').join('\n')+'\n\n';
  }
  return out.trim();
}

async function analyze(id){
  const c=(await getAll()).find(k=>k.id===id);if(!c)return;
  msg('Erkenne Töne …');
  try{const x=await decode(c.blob);c.notes=detect(x);await put(c);msg(c.notes.length?'':'Keine Töne erkannt (zu leise oder mehrstimmig?).')}
  catch(e){msg('Analyse fehlgeschlagen: '+e.message)}
  await render();
}

/* Gemini */
function toWav(x){
  const b=new ArrayBuffer(44+x.length*2),v=new DataView(b),w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
  w(0,'RIFF');v.setUint32(4,36+x.length*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,SR,true);v.setUint32(28,SR*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,x.length*2,true);
  x.forEach((s,i)=>v.setInt16(44+i*2,Math.max(-1,Math.min(1,s))*32767,true));return b;
}
async function askGemini(id){
  const key=ls.get('gkey');if(!key){msg('Bitte zuerst den Gemini-API-Key eintragen.');return}
  const c=(await getAll()).find(k=>k.id===id);if(!c)return;
  msg('Gemini analysiert …');
  try{
    const x=await decode(c.blob);
    const b64=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(new Blob([toWav(x)],{type:'audio/wav'}))});
    const found=(c.notes||[]).map(n=>nn(n.m)).join(' ')||'keine';
    const prompt=`Du bist ein erfahrener Gitarrenlehrer. Analysiere diese Aufnahme eines kurzen Gitarrenstücks. Gib NUR gültiges JSON zurück (kein Markdown). Alle Texte auf Deutsch, kurz und für Einsteiger verständlich. Felder:
"name": einprägsamer Titel mit 2 bis 4 Wörtern, der Spielart und Stimmung widerspiegelt (z. B. "Sanfter Regen in Moll"),
"stimmung": Emotion in 1 bis 2 Wörtern,
"spielart": Spielweise in 1 bis 3 Wörtern (z. B. Fingerpicking, Strumming, Lead-Melodie),
"tonart": Tonart/Skala,
"tempo_bpm": Zahl,
"akkorde": Liste der Akkorde in Spielreihenfolge, je {"name":"Am","bunde":[6 Zahlen von tiefer E- bis hoher e-Saite; -1 = nicht spielen, 0 = leer, sonst Bundnummer],"finger":[6 Zahlen, 0 = kein Finger, 1 = Zeigefinger bis 4 = kleiner Finger]}. Leere Liste, falls keine Akkorde gespielt werden,
"ablauf": Liste mit Schritten zum Nachspielen in Reihenfolge (Anschlag, Rhythmus, Wechsel),
"besonderheiten": Liste (Techniken wie Hammer-on, Slide, Bending, Vibrato, Dämpfen),
"tipps": Liste mit Übungstipps.
Automatisch erkannte Töne (einstimmig, können falsch sein, korrigiere sie bei Bedarf): ${found}`;
    const model=ls.get('gmodel')||'gemini-2.5-flash';
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({contents:[{parts:[{text:prompt},{inline_data:{mime_type:'audio/wav',data:b64}}]}],generationConfig:{responseMimeType:'application/json',temperature:0.7}})});
    const j=await r.json();
    if(!r.ok)throw new Error(j.error&&j.error.message||r.status);
    const txt=j.candidates[0].content.parts.map(p=>p.text||'').join('').replace(/```json|```/g,'').trim();
    c.ai=JSON.parse(txt);
    if(c.ai.name&&!c.renamed)c.name=String(c.ai.name).slice(0,60);
    await put(c);msg('');
  }catch(e){msg('Gemini-Fehler: '+e.message)}
  await render();
}

/* Wiedergabe */
let CL={},ac;const PCM={};
const audioCtx=()=>{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac};
function pluck(m){
  const c=audioCtx(),t=c.currentTime,f=440*2**((m-69)/12),o=c.createOscillator(),fl=c.createBiquadFilter(),g=c.createGain();
  o.type='sawtooth';o.frequency.value=f;fl.type='lowpass';
  fl.frequency.setValueAtTime(Math.min(f*8,8000),t);fl.frequency.exponentialRampToValueAtTime(f*1.5,t+0.7);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.5,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+1.6);
  o.connect(fl);fl.connect(g);g.connect(c.destination);o.start(t);o.stop(t+1.7);
}
async function playOrig(c,n){
  const ctx=audioCtx();if(!PCM[c.id])PCM[c.id]=await decode(c.blob);
  const x=PCM[c.id],st=Math.max(0,Math.floor((n.t-0.03)*SR)),en=Math.min(x.length,Math.floor((n.t+Math.max(n.d,0.25)+0.1)*SR));
  const b=ctx.createBuffer(1,en-st,SR);b.copyToChannel(x.slice(st,en),0);
  const src=ctx.createBufferSource();src.buffer=b;src.connect(ctx.destination);src.start();
}
async function playNote(g){
  const c=CL[+g.closest('.clip').dataset.id],n=c&&c.notes&&c.notes[+g.dataset.i];if(!n)return;
  g.classList.add('on');setTimeout(()=>g.classList.remove('on'),350);
  try{if($('#playMode').value==='orig')await playOrig(c,n);else pluck(n.m)}catch(e){msg('Wiedergabe fehlgeschlagen: '+e.message)}
}

/* Visuelle Darstellung */
function chordSvg(c){
  const f=c.bunde||[],fi=c.finger||[],pos=f.filter(n=>n>0),max=Math.max(0,...pos),min=pos.length?Math.min(...pos):1,base=max>4?min:1;
  let s=`<svg viewBox="0 0 90 114" width="90" role="img" aria-label="Akkord ${esc(String(c.name||''))}"><text x="45" y="12" text-anchor="middle" class="cn">${esc(String(c.name||''))}</text>`;
  for(let j=0;j<=5;j++)s+=`<line x1="14" y1="${32+j*16}" x2="74" y2="${32+j*16}" class="${j===0&&base===1?'nut':'gl'}"/>`;
  for(let i=0;i<6;i++){
    const x=14+i*12;s+=`<line x1="${x}" y1="32" x2="${x}" y2="112" class="gl"/>`;
    if(f[i]===-1)s+=`<text x="${x}" y="27" text-anchor="middle" class="mk">×</text>`;
    else if(f[i]===0)s+=`<circle cx="${x}" cy="23" r="3.2" class="op"/>`;
    else if(f[i]>0){
      const y=32+(f[i]-base)*16+8;
      if(f[i]-base<5)s+=`<circle cx="${x}" cy="${y}" r="5.5" class="dot"/>`+(fi[i]>0?`<text x="${x}" y="${y+3.5}" text-anchor="middle" class="fn">${fi[i]}</text>`:'');
    }
  }
  if(base>1)s+=`<text x="78" y="${32+8+4}" class="mk">${base}.</text>`;
  return s+'</svg>';
}
function tabSvg(ns){
  const cols=tabCols(ns),per=8,cw=36,L=22,W=L+per*cw+6,rows=[];
  for(let i=0;i<cols.length;i+=per){
    const part=cols.slice(i,i+per),w=L+part.length*cw+2;
    let s=`<svg viewBox="0 0 ${W} 116" role="img" aria-label="Tabulatur">`;
    LAB.forEach((l,k)=>{const y=12+k*15;s+=`<text x="5" y="${y+4}" class="mk">${l}</text><line x1="${L}" y1="${y}" x2="${w}" y2="${y}" class="gl"/>`});
    part.forEach((c,j)=>{
      const x=L+j*cw+cw/2,n=ns[i+j];
      s+=`<g class="nt" data-i="${i+j}" tabindex="0" role="button" aria-label="Ton ${nn(n.m)} abspielen"><rect x="${x-cw/2}" y="0" width="${cw}" height="116" fill="transparent"/>`;
      if(c){const y=12+c.s*15;s+=`<circle cx="${x}" cy="${y}" r="7.2" class="tb"/><text x="${x}" y="${y+3.6}" text-anchor="middle" class="tn">${c.f}</text>`}
      const bw=Math.min(cw-6,Math.max(6,n.d*40));
      s+=`<rect x="${x-bw/2}" y="98" width="${bw}" height="3" rx="1.5" class="du"/><text x="${x}" y="112" text-anchor="middle" class="mk">${nn(n.m)}</text></g>`;
    });
    rows.push(s+'</svg>');
  }
  return `<div class="tabs">${rows.join('')}</div>`;
}
const li=x=>Array.isArray(x)&&x.length?x.map(t=>`<li>${esc(String(t))}</li>`).join(''):'';
function aiParts(a){
  if(!a)return['',''];
  if(typeof a==='string')return['',`<div class="ai">${esc(a)}</div>`];
  const tags=[a.stimmung,a.spielart,a.tonart,a.tempo_bpm?a.tempo_bpm+' BPM':''].filter(Boolean).map(t=>`<span>${esc(String(t))}</span>`).join('');
  const top=`<div class="tags">${tags}</div>`+(a.akkorde&&a.akkorde.length?`<h3>Akkorde in Reihenfolge</h3><div class="chords">${a.akkorde.map(chordSvg).join('')}</div>`:'');
  const bot=(li(a.ablauf)?`<h3>So spielst du es nach</h3><ol>${li(a.ablauf)}</ol>`:'')+(li(a.besonderheiten)?`<h3>Besonderheiten</h3><ul>${li(a.besonderheiten)}</ul>`:'')+(li(a.tipps)?`<h3>Tipps</h3><ul>${li(a.tipps)}</ul>`:'');
  return[top,bot];
}
function aiText(a){
  if(!a)return'';if(typeof a==='string')return a;
  return[a.name,[a.stimmung,a.spielart,a.tonart,a.tempo_bpm&&a.tempo_bpm+' BPM'].filter(Boolean).join(', '),(a.akkorde||[]).map(c=>c.name+' ('+(c.bunde||[]).map(n=>n<0?'x':n).join('-')+')').join('  '),(a.ablauf||[]).map((t,i)=>(i+1)+'. '+t).join('\n'),(a.tipps||[]).join('\n')].filter(Boolean).join('\n\n');
}

/* Anzeige */
const esc=s=>s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const urls=[];
async function render(){
  urls.splice(0).forEach(URL.revokeObjectURL);
  const clips=(await getAll()).sort((a,b)=>b.id-a.id),showTab=$('#tabOpt').checked;
  CL={};clips.forEach(c=>CL[c.id]=c);
  $('#list').innerHTML=clips.length?clips.map(c=>{
    const u=URL.createObjectURL(c.blob);urls.push(u);
    const notes=c.notes?(c.notes.length?c.notes.map(n=>nn(n.m)).join(' '):'Keine Töne erkannt'):'Noch nicht analysiert';
    return `<article class="clip" data-id="${c.id}">
      <input class="name" type="text" value="${esc(c.name).replace(/"/g,'&quot;')}" aria-label="Titel">
      <div class="meta">${new Date(c.id).toLocaleString('de-DE')}</div>
      <audio controls src="${u}"></audio>
      <div class="btns">
        <button class="b" data-a="notes">Töne neu erkennen</button>
        <button class="b p" data-a="ai">Neu analysieren (Gemini)</button>
        <button class="b" data-a="copy">Kopieren</button>
        <button class="b d" data-a="del">Löschen</button>
      </div>
      ${aiParts(c.ai)[0]}
      ${showTab&&c.notes&&c.notes.length?`<h3>Tabulatur</h3><p class="hint">Zahl im Kreis = Bund, Zeile = Saite (unten tiefes E). Balken unter den Linien = Tonlänge. Tippe auf einen Ton, um ihn zu hören.</p>${tabSvg(c.notes)}`:''}
      ${aiParts(c.ai)[1]}
      <div class="meta">Erkannte Töne: ${esc(notes)}</div>
    </article>`}).join(''):'<p class="empty">Noch keine Aufnahmen. Tippe auf den Knopf und spiel los.</p>';
}
$('#list').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('nt')){e.preventDefault();playNote(e.target)}});
$('#list').addEventListener('click',async e=>{
  const g=e.target.closest('.nt');if(g){playNote(g);return}
  const b=e.target.closest('button');if(!b)return;
  const id=+b.closest('.clip').dataset.id,a=b.dataset.a;
  if(a==='notes')analyze(id);
  else if(a==='ai')askGemini(id);
  else if(a==='del'){if(confirm('Aufnahme löschen?')){await del(id);render()}}
  else if(a==='copy'){
    const c=(await getAll()).find(k=>k.id===id);
    const t=[c.name,(c.notes||[]).map(n=>nn(n.m)).join(' '),$('#tabOpt').checked&&c.notes?makeTab(c.notes):'',aiText(c.ai)].filter(Boolean).join('\n\n');
    try{await navigator.clipboard.writeText(t);msg('Kopiert.')}catch(err){msg('Kopieren nicht möglich.')}
  }
});
$('#list').addEventListener('change',async e=>{
  if(!e.target.classList.contains('name'))return;
  const id=+e.target.closest('.clip').dataset.id,c=(await getAll()).find(k=>k.id===id);c.name=e.target.value;c.renamed=true;await put(c);
});
$('#tabOpt').checked=ls.get('tabs')!=='0';
$('#playMode').value=ls.get('pm')||'syn';$('#playMode').onchange=()=>ls.set('pm',$('#playMode').value);
$('#tabOpt').onchange=()=>{ls.set('tabs',$('#tabOpt').checked?'1':'0');render()};
$('#gkey').value=ls.get('gkey')||'';$('#gkey').onchange=()=>ls.set('gkey',$('#gkey').value.trim());
$('#gmodel').value=ls.get('gmodel')||'';$('#gmodel').onchange=()=>ls.set('gmodel',$('#gmodel').value.trim());
render();
</script></body></html>
